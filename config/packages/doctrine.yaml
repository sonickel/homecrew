doctrine:
    dbal:
        # serverVersion and charset are part of DATABASE_URL (see .env)
        url: '%env(resolve:DATABASE_URL)%'
        # Points in time are stored in UTC (docs/konzept/konzept-6-datenbank.md §2)
        options:
            !php/const Pdo\Mysql::ATTR_INIT_COMMAND: "SET time_zone = '+00:00'"
        default_table_options:
            charset: utf8mb4
            collation: utf8mb4_unicode_ci
        # Reads TINYINT columns like docs/datenbank/schema.sql means them (konzept-6 §6)
        schema_manager_factory: App\Doctrine\Schema\MariaDbSchemaManagerFactory
        types:
            tinyint: App\Doctrine\Type\TinyIntType

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
