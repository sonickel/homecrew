framework:
    rate_limiter:
        # Second login step (code from the app or recovery code), per person
        two_factor:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Invitation codes typed or scanned, per IP address (the codes themselves cannot be guessed)
        invitation:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # Fresh confirmation before changing how one logs in ("Mein Konto"), per person
        account_confirm:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
