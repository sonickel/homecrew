framework:
    rate_limiter:
        # Second login step (code from the app or recovery code), per person
        two_factor:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Invitation codes typed or scanned, per IP address (the codes themselves cannot be guessed)
        invitation:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # Fresh confirmation before changing how one logs in ("Mein Konto"), per person
        account_confirm:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Pairing codes typed at a tablet (Verwaltung → Geräte → Tablet koppeln), per IP address
        pairing:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # PIN tries at one tablet across all persons (each person also pauses 5 minutes after 3 wrong PINs)
        pin_login:
            policy: sliding_window
            limit: 15
            interval: '15 minutes'
