security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\AppUser
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            access_denied_handler: App\Security\AccessDeniedHandler

            # Username + password (konzept-1 §5); a person with a second factor continues with two_factor
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # Second step after the password (scheb/2fa): code from the app or recovery code
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true
                default_target_path: app_home

            # Passkey login without username – a complete login on its own (user verification required)
            webauthn:
                success_handler: App\Security\Passkey\PasskeyLoginHandler
                failure_handler: App\Security\Passkey\PasskeyLoginHandler
                authentication:
                    profile: login
                    routes:
                        options_path: /anmelden/passkey/optionen
                        result_path: /anmelden/passkey
                registration:
                    enabled: false

            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/anmelden/code, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/anmelden, roles: PUBLIC_ACCESS }
        # The lazy firewall checks access before logging out: "Abbrechen" in the second step must work too (CSRF-protected)
        - { path: ^/abmelden$, roles: PUBLIC_ACCESS }
        # Redeeming an invitation (konzept-1 §4): before the person has a password
        - { path: ^/einladung, roles: PUBLIC_ACCESS }
        # Admin rights are decided by App\Security\Voter\AdminVoter, the controllers check again
        - { path: ^/verwaltung, roles: ADMIN }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
