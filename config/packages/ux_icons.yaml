# Icons are stored locally as SVG in assets/icons/ (import once: bin/console ux:icons:import tabler:<name>).
# No on-demand download at runtime – everything is delivered locally.
ux_icons:
    default_icon_attributes:
        fill: currentColor
        height: '1em'
        width: '1em'
    iconify:
        enabled: false
    ignore_not_found: false

when@prod:
    ux_icons:
        ignore_not_found: true
